<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Tavlehuset i Babylon</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b120a; }
    canvas { display: block; touch-action: none; }
    #hjaelp {
      /* Øverst til venstre og lille, så den ikke dækker lerbrikkerne nederst */
      position: fixed; left: 12px; top: 12px; max-width: 300px;
      padding: 7px 11px; border-radius: 7px;
      background: rgba(30, 18, 8, 0.6); color: #f3e2c4;
      font: 12px/1.4 Georgia, serif; pointer-events: none;
    }
    #hjaelp b { color: #ffd27a; }
    body.in-vr #hjaelp { display: none; }
    /* VR-knappen øverst til højre, så den ikke dækker lerbrikkerne nederst i billedet */
    #VRButton { bottom: auto !important; top: 16px !important; left: auto !important; right: 16px !important; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="hjaelp">
    <b>Tavlehuset i Babylon</b><br>
    Træk med musen for at se dig omkring · <b>WASD</b> for at gå · Klik på lertavlerne.<br>
    Har du et VR-headset, så tryk <b>ENTER VR</b>.
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
